<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Hybrid IPTV Player</title>
    <meta name="description" content="Nova Hybrid Web & Android IPTV Player with support for Stalker / Ministra portals, Xtream Codes and M3U playlists.">
    <meta property="og:title" content="Nova Hybrid IPTV Player">
    <meta property="og:description" content="Nova Hybrid Web & Android IPTV Player with support for Stalker / Ministra portals, Xtream Codes and M3U playlists.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0c1017;
        }

        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }

        body {
            background-color: #0c1017;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::selection {
            background-color: #4f46e5;
            color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-h: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.8));
            border-bottom: 1px solid rgba(79, 70, 229, 0.2);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 900;
            font-size: 1.25rem;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 1rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 0.5rem;
            color: #f1f5f9;
            font-size: 0.875rem;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        .search-box input:focus {
            outline: none;
            border-color: #4f46e5;
            background: rgba(30, 41, 59, 0.95);
        }

        .header-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(to right, #4338ca, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background: rgba(79, 70, 229, 0.1);
            color: #c7d2fe;
            border: 1px solid rgba(79, 70, 229, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(79, 70, 229, 0.2);
            border-color: rgba(79, 70, 229, 0.5);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 9999px;
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        .status-badge.connected {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Content */
        .main-content {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid rgba(79, 70, 229, 0.1);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }

        .tab-button {
            flex: 1;
            min-width: 120px;
            padding: 1rem;
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-button.active {
            color: #c7d2fe;
            border-bottom-color: #4f46e5;
        }

        .tab-button:hover:not(.active) {
            color: #cbd5e1;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .category-btn {
            padding: 0.5rem 1rem;
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.3);
            color: #cbd5e1;
            border-radius: 9999px;
            cursor: pointer;
            font-size: 0.875rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: rgba(79, 70, 229, 0.2);
            border-color: #4f46e5;
            color: #c7d2fe;
        }

        /* Media Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .media-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 0.75rem;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .media-card:hover {
            border-color: rgba(79, 70, 229, 0.5);
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.5), 0 0 30px rgba(79, 70, 229, 0.2);
            transform: translateY(-8px);
        }

        .media-card-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .media-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .media-card:hover .play-overlay {
            opacity: 1;
        }

        .play-button {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .media-card-info {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .media-card-title {
            font-weight: 600;
            color: white;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .media-card-meta {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 0.75rem;
        }

        .media-card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(79, 70, 229, 0.1);
            border-radius: 0.375rem;
            color: #c7d2fe;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .icon-btn:hover {
            background: rgba(79, 70, 229, 0.2);
            color: #e0e7ff;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #0f172a;
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 1rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(79, 70, 229, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .modal-close {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: white;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Loading */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(79, 70, 229, 0.3);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-container {
            display: flex;
            justify-content: center;
            padding: 3rem 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .header-content {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="#" class="logo">
                    <div class="logo-icon">🎬</div>
                    <span>Nova TV</span>
                </a>

                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search channels, movies, series..."
                    >
                </div>

                <div class="header-buttons">
                    <span class="status-badge" id="statusBadge">
                        <span class="status-dot"></span>
                        <span id="statusText">Connecting...</span>
                    </span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-button active" data-tab="live">📺 Live TV</button>
                <button class="tab-button" data-tab="movies">🎬 Movies</button>
                <button class="tab-button" data-tab="series">📺 Series</button>
            </div>

            <!-- Categories -->
            <div class="categories" id="categoriesContainer"></div>

            <!-- Media Grid -->
            <div id="mediaGrid" class="media-grid"></div>

            <!-- Loading -->
            <div id="loadingContainer" class="loading-container" style="display: none;">
                <div class="spinner"></div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📭</div>
                <h3>No items found</h3>
                <p>Try a different search or category.</p>
            </div>
        </main>
    </div>

    <!-- Player Modal -->
    <div id="playerModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="playerTitle">Playing...</h2>
                <button class="modal-close" id="closePlayerModal">✕</button>
            </div>
            <div class="modal-body">
                <div class="video-container">
                    <video id="videoPlayer" controls>
                        <source src="" type="application/x-mpegURL">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div id="playerInfo"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'http://localhost:3000/api'; // Change to your domain
        
        // State
        const state = {
            currentView: 'live',
            items: [],
            categories: [],
            selectedCategory: 'all',
            searchQuery: '',
            favorites: [],
            isLoading: false
        };

        // API Helper
        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_URL}${endpoint}`);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                updateStatus('error', 'Connection failed');
                return null;
            }
        }

        // Load media
        async function loadMedia() {
            state.isLoading = true;
            document.getElementById('loadingContainer').style.display = 'flex';

            let data;
            if (state.currentView === 'live') {
                data = await fetchAPI('/channels');
            } else if (state.currentView === 'movies') {
                data = await fetchAPI(`/movies?category=${state.selectedCategory}`);
            } else {
                data = await fetchAPI(`/series?category=${state.selectedCategory}`);
            }

            if (data?.success) {
                state.items = data.data;
                loadCategories();
                renderGrid();
                updateStatus('connected', `Loaded ${data.total} items`);
            }

            state.isLoading = false;
            document.getElementById('loadingContainer').style.display = 'none';
        }

        // Load categories
        async function loadCategories() {
            if (state.currentView === 'live') {
                state.categories = [...new Set(state.items.map(i => i.group))];
            } else {
                const endpoint = state.currentView === 'movies' ? '/movies' : '/series';
                const data = await fetchAPI(`/categories/${state.currentView}`);
                state.categories = data?.data || [];
            }
            renderCategories();
        }

        // Render categories
        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = `
                <button class="category-btn ${state.selectedCategory === 'all' ? 'active' : ''}" data-category="all">All</button>
                ${state.categories.map(cat => `
                    <button class="category-btn ${state.selectedCategory === cat.id || state.selectedCategory === cat ? 'active' : ''}" data-category="${cat.id || cat}">
                        ${cat.name || cat}
                    </button>
                `).join('')}
            `;

            container.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedCategory = btn.dataset.category;
                    loadMedia();
                });
            });
        }

        // Render grid
        function renderGrid() {
            const grid = document.getElementById('mediaGrid');
            let filtered = state.items;

            if (state.searchQuery) {
                const q = state.searchQuery.toLowerCase();
                filtered = filtered.filter(item => item.name.toLowerCase().includes(q));
            }

            if (filtered.length === 0) {
                grid.style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            document.getElementById('emptyState').style.display = 'none';
            grid.style.display = 'grid';

            grid.innerHTML = filtered.map(item => `
                <div class="media-card">
                    <div class="media-card-image">
                        <img src="${item.logo}" alt="${item.name}" onerror="this.style.display='none'">
                        <div class="play-overlay">
                            <div class="play-button">▶</div>
                        </div>
                    </div>
                    <div class="media-card-info">
                        <div class="media-card-title">${item.name}</div>
                        <div class="media-card-meta">
                            ${item.group || ''} 
                            ${item.year ? `• ${item.year}` : ''} 
                            ${item.seasons ? `• ${item.seasons} Seasons` : ''}
                        </div>
                        <div class="media-card-actions">
                            <button class="icon-btn">🤍</button>
                        </div>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.media-card').forEach((card, idx) => {
                card.addEventListener('click', () => playItem(filtered[idx]));
            });
        }

        // Play item
        function playItem(item) {
            document.getElementById('playerTitle').textContent = item.name;
            document.getElementById('playerInfo').innerHTML = `
                <p style="color: #9ca3af;"><strong>Now playing:</strong> ${item.name}</p>
                ${item.description ? `<p style="color: #9ca3af; margin-top: 0.5rem;">${item.description}</p>` : ''}
            `;
            
            const video = document.getElementById('videoPlayer');
            video.src = item.url;
            
            document.getElementById('playerModal').classList.add('active');
        }

        // Update status
        function updateStatus(type, message) {
            const badge = document.getElementById('statusBadge');
            const dot = badge.querySelector('.status-dot');
            const text = document.getElementById('statusText');

            badge.className = `status-badge ${type === 'connected' ? 'connected' : ''}`;
            dot.className = `status-dot ${type === 'connected' ? 'connected' : ''}`;
            text.textContent = message;
        }

        // Event Listeners
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.currentView = btn.dataset.tab;
                state.selectedCategory = 'all';
                loadMedia();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderGrid();
        });

        document.getElementById('closePlayerModal').addEventListener('click', () => {
            document.getElementById('playerModal').classList.remove('active');
            document.getElementById('videoPlayer').pause();
        });

        document.getElementById('playerModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('playerModal')) {
                document.getElementById('playerModal').classList.remove('active');
                document.getElementById('videoPlayer').pause();
            }
        });

        // Initialize
        async function init() {
            updateStatus('connecting', 'Connecting to server...');
            
            // Check server health
            const health = await fetchAPI('/health');
            if (health?.success) {
                updateStatus('connected', 'Connected to server');
                loadMedia();
            } else {
                updateStatus('error', 'Server not available');
            }
        }

        init();
    </script>
</body>
</html>
